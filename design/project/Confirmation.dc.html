<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Confirmation d'achat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 1220px; position: relative; background: {{t.bg}}; color: {{t.text}}; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

<header style="height: 56px; padding: 0 4px 0 16px; display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: {{t.okBg}}; color: {{t.okText}}; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 50%; background: {{t.okFill}}; color: {{t.okOn}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Paiement confirmé</span>
<a href="Accueil.dc.html" aria-label="Fermer" style="width: 48px; height: 48px; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></a>
</header>

<div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 72%; font-size: 40px; line-height: 0.95">C'est bon ! Vos billets sont prêts.</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: {{t.muted}}">Un SMS avec le lien est parti vers le 97 123 45 67.</p>
</div>

<div style="padding: 4px 8px 0">
<dc-import name="Billet" ticket-id="ET-7K4Q-19XZ" dark="{{dark}}" arrivee="{{yes}}" hint-size="344px,720px"></dc-import>
</div>

<div style="display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; color: {{t.muted}}; margin-top: -4px">
<span style="width: 10px; height: 10px; background: {{t.text}}; transform: rotate(45deg)"></span>
<span style="width: 10px; height: 10px; border: 2px solid {{t.muted}}; box-sizing: border-box; transform: rotate(45deg)"></span>
<span style="margin-left: 6px">Billet 1 sur 2 · glissez</span>
</div>

<div style="padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<button style="height: 56px; border-radius: 14px; border: 2px solid {{t.btnBorder}}; background: #FFD21F; color: #14120E; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 17px 'Atkinson Hyperlegible', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"></path></svg>Télécharger en PDF</button>
<button style="height: 56px; border-radius: 14px; border: 2px solid {{t.text}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 17px 'Atkinson Hyperlegible', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v13H3z M3 7l13-4v4 M16 13h2"></path></svg>Ajouter au portefeuille</button>
<button style="height: 56px; border-radius: 14px; border: 2px solid {{t.text}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 17px 'Atkinson Hyperlegible', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg>Partager sur WhatsApp</button>
<a href="MesBillets.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.link}}; font-weight: 700; font-size: 16px">Voir tous mes billets</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":1220}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#FBF5E6', surface: '#FFFDF7', text: '#14120E', muted: '#5C5446', shadow: '3px 3px 0 #14120E', btnBorder: '#14120E', link: '#0050A6', okFill: '#0B7A3E', okOn: '#FFFFFF', okText: '#0B6B37', okBg: '#DDF3E4' };
    const D = { bg: '#0D0C0A', surface: '#1A1813', text: '#FBF5E6', muted: '#B9AE98', shadow: 'none', btnBorder: '#FFD21F', link: '#8CC4FF', okFill: '#34C26E', okOn: '#14120E', okText: '#5BE08F', okBg: '#0E2E1B' };
    return { t: dark ? D : L, dark: dark, yes: true };
  }
}
</script>
</body>
</html>
