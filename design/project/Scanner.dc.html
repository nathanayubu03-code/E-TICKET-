<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scanner du contrôleur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes scan-ligne{0%{top:8%}50%{top:88%}100%{top:8%}}
.scan-ligne{animation:scan-ligne 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.scan-ligne{animation:none}}
</style>
</helmet>
<div style="width: 360px; height: 800px; position: relative; background: {{bg}}; color: {{fg}}; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

<header style="padding: 10px 12px 12px; background: {{bar.bg}}; color: {{bar.fg}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 15px; font-weight: 700">Porte B · Nuit de la Rumba</span>
<span role="status" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #FFD21F; color: #14120E; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 4-2.4 M22 8.5A15 15 0 0 0 10.5 5 M8.5 16a5 5 0 0 1 7 0 M12 20h0 M3 3l18 18"></path></svg>Hors ligne · 37 à envoyer</span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 6px; line-height: 1"><span style="font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 80%; font-size: 40px">1 248</span><span style="font-size: 15px; font-weight: 700">/ 5 000 entrées</span></div>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">Signe <span style="display: inline-block; width: 16px; height: 16px; background: #FFD21F; border: 2px solid {{bar.fg}}; transform: rotate(45deg)"></span></span>
</div>
</header>

<sc-if value="{{isPret}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 16px; gap: 16px">
<div style="position: relative; width: 300px; height: 300px; border-radius: 24px; background: #1F1C16; overflow: hidden">
<div style="position: absolute; left: 24px; top: 24px; width: 56px; height: 56px; border-left: 8px solid #FFD21F; border-top: 8px solid #FFD21F; border-radius: 12px 0 0 0"></div>
<div style="position: absolute; right: 24px; top: 24px; width: 56px; height: 56px; border-right: 8px solid #FFD21F; border-top: 8px solid #FFD21F; border-radius: 0 12px 0 0"></div>
<div style="position: absolute; left: 24px; bottom: 24px; width: 56px; height: 56px; border-left: 8px solid #FFD21F; border-bottom: 8px solid #FFD21F; border-radius: 0 0 0 12px"></div>
<div style="position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px; border-right: 8px solid #FFD21F; border-bottom: 8px solid #FFD21F; border-radius: 0 0 12px 0"></div>
<div class="scan-ligne" style="position: absolute; left: 36px; right: 36px; height: 4px; border-radius: 2px; background: #FFD21F"></div>
</div>
<p style="margin: 0; text-align: center; font-family: 'Anybody', sans-serif; font-weight: 850; font-stretch: 80%; font-size: 28px; line-height: 1.05">Placez le QR code dans le cadre</p>
<p style="margin: 0; text-align: center; font-size: 16px; line-height: 1.4; color: {{muted}}">Puis vérifiez que le motif bouge et que le signe est un <b style="color: {{fg}}">losange jaune</b>.</p>
<div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 64px; border-radius: 16px; border: 2px solid {{fg}}; background: transparent; color: {{fg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 17px 'Atkinson Hyperlegible', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>Lampe</button>
<button style="height: 64px; border-radius: 16px; border: 2px solid {{fg}}; background: transparent; color: {{fg}}; font: 700 17px 'Atkinson Hyperlegible', sans-serif">Saisir le n°</button>
</div>
</div>
</sc-if>

<sc-if value="{{isResult}}" hint-placeholder-val="{{false}}">
<div role="alert" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 20px; gap: 10px; text-align: center">
<span style="width: 150px; height: 150px; border-radius: 50%; border: 8px solid {{fg}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"></path></svg>
</span>
<h1 style="margin: 6px 0 0; font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 70%; font-size: 68px; line-height: 0.9; letter-spacing: 0.01em">{{titre}}</h1>
<p style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">{{ligne1}}</p>
<p style="margin: 0; font-size: 17px; line-height: 1.35">{{ligne2}}</p>
<sc-if value="{{isValide}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 6px; padding: 10px; border-radius: 16px; background: #FFFFFF; color: #14120E; display: flex; align-items: center; gap: 12px; text-align: left">
<div style="width: 88px; height: 88px; border-radius: 8px; overflow: hidden; line-height: 0">
<dc-import name="Kuba" ticket-id="ET-7K4Q-19XZ" cols="{{n11}}" rows="{{n11}}" cell="{{n8}}" hole="{{yes}}" live="{{yes}}" hint-size="88px,88px"></dc-import>
</div>
<span style="font-size: 15px; line-height: 1.35"><b>Motif attendu maintenant.</b><br>Le téléphone doit montrer le même, en mouvement.</span>
</div>
</sc-if>
<div style="margin-top: auto; width: 100%">
<button style="width: 100%; height: 68px; border-radius: 18px; border: 3px solid {{btn.border}}; background: {{btn.bg}}; color: {{btn.fg}}; font: 700 20px 'Atkinson Hyperlegible', sans-serif">Scanner le suivant</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["pret","valide","refuse","deja"],"default":"pret"},"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const etat = this.props.etat ?? 'pret';
    const ink = '#14120E', cream = '#FBF5E6';
    // Couleurs pleines : un peu plus sombres la nuit pour ne pas éblouir, texte toujours AA
    const S = {
      pret: { bg: dark ? '#0D0C0A' : cream, fg: dark ? cream : ink, muted: dark ? '#B9AE98' : '#5C5446' },
      valide: { bg: dark ? '#0A6634' : '#0B7A3E', fg: '#FFFFFF', titre: 'VALIDE', ligne1: 'VIP · 1 personne', ligne2: 'Grâce Mbuyi · ET-7K4Q-19XZ', icon: 'M5 12.5l4.5 4.5L19 7.5' },
      refuse: { bg: dark ? '#A50D25' : '#C8102E', fg: '#FFFFFF', titre: 'REFUSÉ', ligne1: 'Billet inconnu pour cet événement', ligne2: 'Envoyez la personne au guichet.', icon: 'M6 6l12 12 M18 6L6 18' },
      deja: { bg: dark ? '#D97A00' : '#F08A00', fg: ink, titre: 'DÉJÀ SCANNÉ', ligne1: 'Premier passage à 19:42', ligne2: 'Porte B, appareil B-2, il y a 38 min.', icon: 'M12 7v5l3 2 M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' }
    };
    const s = S[etat];
    const isPret = etat === 'pret';
    return {
      bg: s.bg, fg: s.fg, muted: s.muted || s.fg,
      bar: isPret && !dark ? { bg: '#F1E6CC', fg: ink } : { bg: '#000000', fg: cream },
      isPret: isPret, isResult: !isPret, isValide: etat === 'valide',
      titre: s.titre || '', ligne1: s.ligne1 || '', ligne2: s.ligne2 || '', icon: s.icon || '',
      btn: s.fg === ink ? { bg: ink, fg: cream, border: ink } : { bg: cream, fg: ink, border: cream },
      yes: true, n8: 8, n11: 11
    };
  }
}
</script>
</body>
</html>
