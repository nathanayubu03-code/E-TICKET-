<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes billets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 1100px; position: relative; background: {{t.bg}}; color: {{t.text}}; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

<header style="padding: 20px 16px 0; display: flex; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Anybody', sans-serif; font-weight: 900; font-stretch: 72%; font-size: 40px; line-height: 1">Mes billets</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: {{t.surface2}}; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 4-2.4 M22 8.5A15 15 0 0 0 10.5 5 M8.5 16a5 5 0 0 1 7 0 M12 20h0 M3 3l18 18"></path></svg>Hors ligne</span>
</header>

<div role="status" style="margin: 14px 16px 0; padding: 12px 14px; border-radius: 14px; background: {{t.skyBg}}; color: {{t.skyText}}; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"></path></svg>
<span><b>Pas d'internet ? Pas de souci.</b> Les billets marqués « Sur ce téléphone » s'ouvrent quand même.</span>
</div>

<div role="tablist" aria-label="Période" style="margin: 16px 16px 0; padding: 4px; border-radius: 14px; background: {{t.surface2}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<button role="tab" aria-selected="true" style="height: 48px; border-radius: 10px; border: 2px solid {{t.text}}; background: {{t.surface}}; color: {{t.text}}; font: 700 16px 'Atkinson Hyperlegible', sans-serif">À venir (2)</button>
<button role="tab" aria-selected="false" style="height: 48px; border-radius: 10px; border: 2px solid transparent; background: transparent; color: {{t.muted}}; font: 700 16px 'Atkinson Hyperlegible', sans-serif">Passés (3)</button>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{avenir}}" as="b" hint-placeholder-count="2">
<a href="Confirmation.dc.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: {{t.surface}}; border: 2px solid {{t.text}}; box-shadow: {{t.shadow}}; color: {{t.text}}; text-decoration: none">
<div style="width: 64px; height: 112px; flex-shrink: 0; border-radius: 10px; overflow: hidden; line-height: 0">
<dc-import name="Kuba" ticket-id="{{b.id}}" cols="{{n4}}" rows="{{n7}}" cell="{{n16}}" hole="{{no}}" live="{{yes}}" hint-size="64px,112px"></dc-import>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Anybody', sans-serif; font-weight: 850; font-stretch: 80%; font-size: 22px; line-height: 1.05">{{b.titre}}</span>
<span style="font-size: 14px; color: {{t.muted}}">{{b.quand}}</span>
<span style="font-size: 14px; font-weight: 700">{{b.qte}}</span>
<span style="margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: {{b.badgeBg}}; color: {{b.badgeFg}}; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.badgeIcon}}"></path></svg>{{b.badge}}</span>
</div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self: center; flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>

<h2 style="margin: 24px 16px 10px; font-family: 'Anybody', sans-serif; font-weight: 850; font-stretch: 80%; font-size: 22px">Passés</h2>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{passes}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{t.surface2}}; color: {{t.muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z M14 7v10"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 15px; color: {{t.text}}">{{p.titre}}</b><span style="font-size: 14px">{{p.info}}</span></div>
</div>
</sc-for>
</div>

<div style="flex-grow: 1"></div>
<nav aria-label="Navigation principale" style="position: sticky; bottom: 0; height: 68px; background: {{t.nav}}; border-top: 1.5px solid {{t.line}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.muted}}; text-decoration: none; font-size: 13px; font-weight: 700"><span style="height: 30px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z M9 20v-6h6v6"></path></svg></span>Accueil</a>
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.text}}; text-decoration: none; font-size: 13px; font-weight: 700"><span style="width: 56px; height: 30px; border-radius: 999px; background: #FFD21F; color: #14120E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z M14 7v10"></path></svg></span>Mes billets</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.muted}}; text-decoration: none; font-size: 13px; font-weight: 700"><span style="height: 30px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"></path></svg></span>Compte</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const L = { bg: '#FBF5E6', surface: '#FFFDF7', surface2: '#F1E6CC', text: '#14120E', muted: '#5C5446', line: '#D9CAA6', shadow: '3px 3px 0 #14120E', skyText: '#0050A6', skyBg: '#DCEBFF', warnText: '#8A4500', warnBg: '#FFE7C2', nav: '#FFFDF7' };
    const D = { bg: '#0D0C0A', surface: '#1A1813', surface2: '#2E2A21', text: '#FBF5E6', muted: '#B9AE98', line: '#4A4436', shadow: 'none', skyText: '#8CC4FF', skyBg: '#0F2A47', warnText: '#FFB84D', warnBg: '#3A2608', nav: '#1A1813' };
    const t = dark ? D : L;
    const check = 'M5 12.5l4.5 4.5L19 7.5';
    const down = 'M12 4v11 M7 10l5 5 5-5';
    const avenir = [
      { id: 'ET-7K4Q-19XZ', titre: 'Nuit de la Rumba', quand: 'Sam. 14 nov. · 20:00 · Stade des Martyrs', qte: '2 billets · Standard', badge: 'Sur ce téléphone', badgeBg: t.skyBg, badgeFg: t.skyText, badgeIcon: check },
      { id: 'ET-M3PA-77QD', titre: 'Match de gala', quand: 'Dim. 15 nov. · 15:30 · Stade Tata Raphaël', qte: '1 billet · Gradins', badge: 'À télécharger', badgeBg: t.warnBg, badgeFg: t.warnText, badgeIcon: down }
    ];
    const passes = [
      { titre: 'Afrobeat Session', info: 'Utilisé le 12 oct. à 21:14' },
      { titre: 'Festival des Grands Lacs, Goma', info: 'Utilisé le 30 août à 16:02' },
      { titre: 'Soirée comédie', info: 'Non utilisé · 2 août' }
    ];
    return { t: t, avenir: avenir, passes: passes, yes: true, no: false, n4: 4, n7: 7, n16: 16 };
  }
}
</script>
</body>
</html>
